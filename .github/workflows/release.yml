name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # ✅ Cache Rust dependencies — saves 5-10 minutes per build
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      # ✅ Write the signing key to a temp file to avoid newline issues
      - name: Prepare signing key
        shell: pwsh
        run: |
          $keyB64 = "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          $keyB64 = $keyB64.Trim()
          $keyBytes = [System.Convert]::FromBase64String($keyB64)
          $keyPath = Join-Path $env:RUNNER_TEMP "tauri_signing.key"
          [System.IO.File]::WriteAllBytes($keyPath, $keyBytes)
          echo "TAURI_KEY_PATH=$keyPath" >> $env:GITHUB_ENV

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'TechnoAfandi - FC ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Upload Raw Executable
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/TechnoAfandi-FC.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
